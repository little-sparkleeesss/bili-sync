name: Build Docker Image (Manual)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 目标架构(逗号分隔)
        type: choice
        default: linux/amd64,linux/arm64,linux/arm/v7
        options:
          - linux/amd64,linux/arm64,linux/arm/v7
          - linux/amd64,linux/arm64
          - linux/amd64
      tags:
        description: 镜像 tag(逗号分隔,默认 latest)
        type: string
        default: latest

jobs:
  build-binary:
    uses: ./.github/workflows/build-binary.yaml

  docker:
    name: Build And Push Docker Image
    needs: build-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          patterns: bili-sync-rs-Linux-*
          merge-multiple: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bili-sync-rs:${{ inputs.tags }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
